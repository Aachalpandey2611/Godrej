services:
  - type: web
    name: medichat-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    buildCommand: ""
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medichat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: medichat-db
    plan: free
    region: oregon
    databaseName: medichat
    user: medichat_user
